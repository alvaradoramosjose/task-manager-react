name: CI
 
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
  
jobs:
  frontend:
    name: Frontend - Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: task-manager-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: task-manager-react/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
 
  backend:
    name: Backend - Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: task-manager-react/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: task-manager-react/backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
